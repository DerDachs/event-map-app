# Fast check for every pull request: analyze and unit tests on Linux.
# Much cheaper than the macOS build, so it gives feedback within minutes.
# Regenerated localization files are committed back to the PR branch.
name: Flutter Check

on:
  pull_request:
    branches:
      - main
  workflow_dispatch:

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref || github.ref }}

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - run: flutter pub get

      - run: flutter gen-l10n

      # Only errors fail the check; the older code still has infos/warnings.
      - name: Analyze
        run: flutter analyze --no-fatal-infos --no-fatal-warnings lib test

      - name: Test
        run: flutter test test

      - name: Commit regenerated localizations
        if: github.event_name == 'pull_request'
        run: |
          git checkout -- analysis_options.yaml 2>/dev/null || true
          if [ -n "$(git status --porcelain lib/l10n)" ]; then
            git config user.name "github-actions[bot]"
            git config user.email "github-actions[bot]@users.noreply.github.com"
            git add lib/l10n
            git commit -m "Regenerate localizations"
            git push || (git pull --rebase --autostash && git push)
          fi
