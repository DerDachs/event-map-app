# Builds the Flutter web app. Pull requests only build it (so web breakage shows
# up early); pushes to main also deploy it to the Cloudflare Worker
# `marketmate-app` (app.marketmate.cellarworks.dev).
#
# Secrets: CLOUDFLARE_API_TOKEN, CLOUDFLARE_ACCOUNT_ID (deploy),
#          GOOGLE_MAPS_WEB_KEY (Maps JavaScript API, restricted to the app domain).
name: Web App

on:
  pull_request:
    branches: [main]
    paths: ['lib/**', 'web/**', 'web-app/**', 'pubspec.yaml', 'assets/**', '.github/workflows/web-app.yml']
  push:
    branches: [main]
    paths: ['lib/**', 'web/**', 'web-app/**', 'pubspec.yaml', 'assets/**', '.github/workflows/web-app.yml']
  workflow_dispatch:

concurrency:
  group: web-app-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - run: flutter pub get

      # CanvasKit is bundled instead of loaded from Google's CDN.
      - name: Build
        run: flutter build web --release --no-web-resources-cdn

      - name: Insert Maps key
        env:
          MAPS_KEY: ${{ secrets.GOOGLE_MAPS_WEB_KEY }}
        run: |
          if [ -z "$MAPS_KEY" ]; then echo "::warning::GOOGLE_MAPS_WEB_KEY missing – the map will not load"; fi
          sed -i "s|__MAPS_WEB_KEY__|${MAPS_KEY}|" build/web/index.html

      # Smoke test: open the app in headless Chrome and show what the console says.
      - name: Smoke test in Chrome
        run: |
          (cd build/web && python3 -m http.server 8080 >/dev/null 2>&1 &)
          sleep 2
          timeout 60 google-chrome --headless=new --no-sandbox --disable-gpu \
            --enable-logging=stderr --v=0 --virtual-time-budget=20000 \
            --screenshot=build/smoke.png --window-size=390,844 http://localhost:8080/ 2> chrome.log || true
          grep -E "CONSOLE|Uncaught|Error" chrome.log | head -40 || true
          if grep -q "Uncaught" chrome.log; then echo "::error::Uncaught error while starting the web app"; exit 1; fi

      - uses: actions/upload-artifact@v4
        with:
          name: web-app
          path: build/web
          retention-days: 7

      - name: Deploy to Cloudflare
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          if [ -z "$CLOUDFLARE_API_TOKEN" ]; then
            echo "::warning::CLOUDFLARE_API_TOKEN missing – build only, not deployed"
            exit 0
          fi
          npx --yes wrangler@4 deploy --config web-app/wrangler.jsonc
