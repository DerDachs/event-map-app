name: iOS Build (Xcode)

# Checks that the iOS app still compiles. macOS minutes are expensive, so this
# only runs for pull requests into main.
on:
  pull_request:
    branches:
      - main
  workflow_dispatch:

jobs:
  ios-build:
    runs-on: macos-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Install dependencies
        run: flutter pub get

      - name: Build iOS app with Xcode (no code signing)
        run: flutter build ios --release --flavor Production --no-codesign --no-tree-shake-icons
