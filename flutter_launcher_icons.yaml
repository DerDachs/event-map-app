# Regenerate after changing the icon: dart run flutter_launcher_icons
# Source files come from brand/ (see brand/README.md).
flutter_launcher_icons:
  image_path: "brand/logo/png/market-mate-app-icon-1024.png"

  ios: true
  remove_alpha_ios: true

  android: "launcher_icon"
  min_sdk_android: 21
  adaptive_icon_background: "#C62828"
  adaptive_icon_foreground: "brand/logo/png/market-mate-app-icon-foreground-1024.png"

  web:
    generate: false

  windows:
    generate: false

  macos:
    generate: false
